<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bearlz CMS{% endblock %}</title>
  <!-- Tema antes do paint (sem flash). Padrão: segue o sistema; escolha manual persiste. -->
  <script>
    (function(){
      try {
        var t = localStorage.getItem('bearlz_theme'); // 'light' | 'dark' | null (sistema)
        var dark = t ? (t === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch(e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════════════════════════
       DESIGN SYSTEM — paleta papel/marfim, acento terracota, componentes
       mínimos (borda fina, canto suave, sombra quase invisível).
       Tokens em CSS vars; dark mode = mesmos tokens com valores quentes.
       O CARD DO CARROSSEL (iframe /arquivo) NÃO usa nada disso.
       ════════════════════════════════════════════════════════════════ */
    :root {
      --bg:            #FAF9F5;   /* papel */
      --panel:         #FFFFFF;
      --panel-2:       #F4F2EC;   /* painel rebaixado */
      --text:          #1F1E1D;
      --text-2:        #57544D;
      --text-3:        #8E8A80;
      --border:        #E8E5DD;
      --border-strong: #D6D2C7;
      --accent:        #C96442;   /* terracota */
      --accent-hover:  #B2532F;
      --accent-soft:   #F4E5DE;
      --ok:            #5E7C5A;
      --ok-soft:       #E7EDE4;
      --info:          #5B7A99;
      --info-soft:     #E5EBF1;
      --warn:          #A8762F;
      --warn-soft:     #F3EAD8;
      --danger:        #A8453A;
      --danger-soft:   #F3E1DE;
      --shadow:        0 1px 2px rgba(31,30,29,.04), 0 4px 16px rgba(31,30,29,.04);
      --radius:        10px;
    }
    html.dark {
      color-scheme: dark;
      --bg:            #1B1A17;
      --panel:         #232220;
      --panel-2:       #2B2A26;
      --text:          #F0EEE7;
      --text-2:        #B6B2A7;
      --text-3:        #807C71;
      --border:        #38362F;
      --border-strong: #4A473E;
      --accent:        #D98A6A;
      --accent-hover:  #E59E80;
      --accent-soft:   #3A2C24;
      --ok:            #92AE8D;
      --ok-soft:       #2A322A;
      --info:          #8FA9C2;
      --info-soft:     #283038;
      --warn:          #C99B53;
      --warn-soft:     #383022;
      --danger:        #CC7A6E;
      --danger-soft:   #3B2A27;
      --shadow:        0 1px 2px rgba(0,0,0,.25), 0 4px 18px rgba(0,0,0,.22);
    }

    * { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Source Serif 4', Georgia, serif; letter-spacing: -0.01em; }
    body { background: var(--bg); color: var(--text); }

    /* ── Componentes do design system ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px;
      font-size: 13.5px; font-weight: 500;
      border: 1px solid var(--border);
      background: var(--panel); color: var(--text-2);
      transition: border-color .15s, background .15s, color .15s;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--border-strong); color: var(--text); }
    .btn-primary {
      background: var(--accent); border-color: var(--accent); color: #FFF;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #FFF; }
    .btn-danger { color: var(--danger); border-color: var(--border); background: transparent; }
    .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .input {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); color: var(--text);
      font-size: 13.5px; outline: none;
      transition: border-color .15s;
    }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--text-3); }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; font-weight: 500;
      padding: 2.5px 9px; border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-2); background: transparent;
    }
    .chip-ok     { color: var(--ok);     background: var(--ok-soft);     border-color: transparent; }
    .chip-info   { color: var(--info);   background: var(--info-soft);   border-color: transparent; }
    .chip-warn   { color: var(--warn);   background: var(--warn-soft);   border-color: transparent; }
    .chip-danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
    .chip-accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
    .seg { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
    .seg a, .seg button {
      padding: 5px 11px; border-radius: 7px; font-size: 13px; font-weight: 500;
      color: var(--text-2); white-space: nowrap; transition: all .15s; border: none; background: transparent; cursor: pointer;
    }
    .seg a:hover, .seg button:hover { color: var(--text); }
    .seg .seg-active { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(31,30,29,.08); }
    .divider { height: 1px; background: var(--border); border: none; }

    .nav-link {
      padding: 6px 12px; border-radius: 8px;
      font-size: 13.5px; font-weight: 500; color: var(--text-2);
      transition: color .15s, background .15s; white-space: nowrap;
    }
    .nav-link:hover { color: var(--text); background: var(--panel-2); }
    .nav-link.active { color: var(--text); background: var(--panel-2); }

    /* ── Camada de compatibilidade: páginas ainda não migradas (calendário,
       gabriel, gerar) usam classes Tailwind cinzas; o dark delas vem daqui. ── */
    html.dark .bg-white         { background-color: var(--panel) !important; }
    html.dark .bg-gray-50       { background-color: var(--bg) !important; }
    html.dark .bg-gray-100      { background-color: var(--panel-2) !important; }
    html.dark .bg-gray-200      { background-color: #38362F !important; }
    html.dark .bg-gray-900      { background-color: #F0EEE7 !important; color: #1B1A17 !important; }
    html.dark .bg-black\/60     { background-color: rgba(255,255,255,.18) !important; }
    html.dark .border-gray-100  { border-color: var(--border) !important; }
    html.dark .border-gray-200  { border-color: var(--border) !important; }
    html.dark .border-gray-300  { border-color: var(--border-strong) !important; }
    html.dark .text-gray-900    { color: var(--text) !important; }
    html.dark .text-gray-800    { color: var(--text) !important; }
    html.dark .text-gray-700    { color: var(--text-2) !important; }
    html.dark .text-gray-600    { color: var(--text-2) !important; }
    html.dark .text-gray-500    { color: var(--text-3) !important; }
    html.dark .text-gray-400    { color: var(--text-3) !important; }
    html.dark .bg-blue-50       { background-color: var(--info-soft) !important; }
    html.dark .bg-green-50      { background-color: var(--ok-soft) !important; }
    html.dark .bg-purple-50     { background-color: rgba(168,85,247,.14) !important; }
    html.dark .bg-orange-50     { background-color: var(--warn-soft) !important; }
    html.dark .bg-red-50        { background-color: var(--danger-soft) !important; }
    html.dark .bg-yellow-50     { background-color: var(--warn-soft) !important; }
    /* Tons -100 (chips do calendário etc.) — sem isso ficam claro-sobre-claro no dark */
    html.dark .bg-blue-100      { background-color: rgba(91,122,153,.28) !important; }
    html.dark .bg-green-100     { background-color: rgba(94,124,90,.30) !important; }
    html.dark .bg-purple-100    { background-color: rgba(168,85,247,.24) !important; }
    html.dark .bg-orange-100    { background-color: rgba(201,155,83,.26) !important; }
    html.dark .bg-red-100       { background-color: rgba(204,122,110,.24) !important; }
    html.dark .bg-yellow-100    { background-color: rgba(201,155,83,.24) !important; }
    html.dark .bg-gray-300      { background-color: var(--border-strong) !important; }
    html.dark .text-blue-600    { color: var(--info) !important; }
    html.dark .text-blue-700,  html.dark .text-blue-600  { color: var(--info) !important; }
    html.dark .text-green-700  { color: var(--ok) !important; }
    html.dark .text-purple-700, html.dark .text-purple-600 { color: #d8b4fe !important; }
    html.dark .text-orange-700 { color: var(--warn) !important; }
    html.dark .text-red-700,   html.dark .text-red-600   { color: var(--danger) !important; }
    html.dark .text-yellow-700 { color: var(--warn) !important; }
    html.dark .border-blue-200   { border-color: rgba(91,122,153,.4) !important; }
    html.dark .border-green-200  { border-color: rgba(94,124,90,.4) !important; }
    html.dark .border-purple-200 { border-color: rgba(168,85,247,.35) !important; }
    html.dark .border-orange-200 { border-color: rgba(168,118,47,.4) !important; }
    html.dark .border-red-200    { border-color: rgba(168,69,58,.4) !important; }
    html.dark .border-yellow-200 { border-color: rgba(168,118,47,.4) !important; }
    html.dark .hover\:bg-gray-100:hover { background-color: var(--panel-2) !important; }
    html.dark .hover\:bg-gray-50:hover  { background-color: var(--panel-2) !important; }
    html.dark .hover\:bg-blue-50:hover  { background-color: var(--info-soft) !important; }
    html.dark .hover\:bg-purple-50:hover{ background-color: rgba(168,85,247,.14) !important; }
    html.dark input, html.dark textarea, html.dark select {
      background-color: var(--panel) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }
    html.dark input::placeholder, html.dark textarea::placeholder { color: var(--text-3) !important; }
    html.dark code.bg-gray-100 { background-color: var(--panel-2) !important; color: var(--text) !important; }
    html.dark .from-gray-50    { --tw-gradient-from: #232220 !important; }
    html.dark .to-gray-100     { --tw-gradient-to:   #2B2A26 !important; }
    html.dark .from-blue-50    { --tw-gradient-from: rgba(91,122,153,.12) !important; }
    html.dark .to-blue-100     { --tw-gradient-to:   rgba(91,122,153,.22) !important; }
    html.dark .from-green-50   { --tw-gradient-from: rgba(94,124,90,.12) !important; }
    html.dark .to-green-100    { --tw-gradient-to:   rgba(94,124,90,.22) !important; }
    html.dark .from-purple-50  { --tw-gradient-from: rgba(168,85,247,.10) !important; }
    html.dark .to-purple-100   { --tw-gradient-to:   rgba(168,85,247,.20) !important; }
    html.dark .from-orange-50  { --tw-gradient-from: rgba(168,118,47,.12) !important; }
    html.dark .to-orange-100   { --tw-gradient-to:   rgba(168,118,47,.22) !important; }

    /* Toggle de tema */
    .theme-toggle {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3); transition: all .15s; cursor: pointer;
      border: none; background: transparent;
    }
    .theme-toggle:hover { background: var(--panel-2); color: var(--text); }
    .theme-toggle .icon-sun  { display: none; }
    .theme-toggle .icon-moon { display: block; }
    html.dark .theme-toggle .icon-sun  { display: block; }
    html.dark .theme-toggle .icon-moon { display: none; }

    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    @media (max-width: 640px) {
      input, textarea, select { font-size: 16px !important; }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Top bar -->
  <header class="sticky top-0 z-40" style="background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)">
    <div class="max-w-screen-xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
      <a href="/" class="flex items-center gap-2 flex-shrink-0">
        <span style="width:9px;height:9px;border-radius:999px;background:var(--accent);display:inline-block"></span>
        <span class="font-display" style="font-size:17px;font-weight:600;color:var(--text)">Bearlz</span>
      </a>
      <nav class="flex items-center gap-0.5 sm:gap-1 overflow-x-auto no-scrollbar">
        <a href="/" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/calendario" class="nav-link {% if request.endpoint == 'calendario' %}active{% endif %}">Calendário</a>
        <a href="/gabriel" class="nav-link {% if request.endpoint == 'gabriel_inbox' %}active{% endif %}">
          Gabriel{% if gabriel_fila > 0 %} <span class="chip chip-accent" style="padding:1px 7px;font-size:11px">{{ gabriel_fila }}</span>{% endif %}
        </a>
        <a href="/gerar" class="btn btn-primary ml-1 sm:ml-2" style="padding:6px 14px">Gerar</a>
        <button onclick="toggleTheme()" class="theme-toggle ml-1 flex-shrink-0" title="Alternar tema">
          <svg class="icon-moon w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
          <svg class="icon-sun w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Toast -->
  <div id="toast" class="fixed top-16 right-4 z-50 hidden">
    <div class="panel" style="padding:10px 16px;font-size:13.5px;color:var(--text)">
      <span id="toast-msg"></span>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-screen-xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Tema: padrão segue o sistema; clique alterna e PERSISTE a escolha.
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('bearlz_theme', isDark ? 'dark' : 'light'); } catch(e) {}
    }
    // Sem escolha manual salva, acompanha mudanças do sistema ao vivo.
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('bearlz_theme')) {
          document.documentElement.classList.toggle('dark', e.matches);
        }
      });
    } catch(e) {}

    function toast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
